name: Matomo Werbeklicks Update

on:
  schedule:
    # Täglich 08:00 Uhr (UTC+2 = 06:00 UTC)
    - cron: "0 6 * * *"
  workflow_dispatch:  # Manuell auslösbar über GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Matomo-Skript ausführen
        env:
          MATOMO_TOKEN: ${{ secrets.MATOMO_TOKEN }}
        run: python matomo-canvas-update.py

      - name: HTML-Report committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Werbeklicks-Report-aktuell.html
          git diff --cached --quiet || git commit -m "Werbeklicks-Report aktualisiert $(date +'%Y-%m-%d')"
          git push
